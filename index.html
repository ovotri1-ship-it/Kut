<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KUTMEISTER — Invoice Potongan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --stone:#f1f1f0;
    --stone-deep:#e3e3e2;
    --paper:#fbfbfa;
    --ink:#4a4a48;
    --ink-soft:#77776f;
    --ink-faint:#a8a8a4;
    --brass:#9a9a96;
    --brass-deep:#6b6b67;
    --line: rgba(74,74,72,0.12);
    --line-strong: rgba(74,74,72,0.22);
    --danger:#8a3d33;
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--stone);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0,0,0,0.025) 0, transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(0,0,0,0.03) 0, transparent 45%);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--stone);}
  svg.ic{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:#f4f4f2;
    border-bottom:1px solid var(--line-strong);
  }
  .brand-strip{
    padding:22px 20px 10px;
    display:flex;flex-direction:column;gap:10px;
  }
  .brand-strip .logo-row{display:flex;align-items:center;gap:12px;}
  .brand-strip img{height:42px;width:auto;display:block;filter:grayscale(1) contrast(1.05);}
  .brand-strip .sub{
    margin-left:auto;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;letter-spacing:.08em;color:var(--ink-faint);
    text-transform:uppercase;
  }
  .brand-strip .contact{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;color:var(--ink-faint);line-height:1.6;
  }
  .tabs{display:flex;padding:0 20px;gap:0;}
  .tab{
    flex:1;padding:11px 4px;background:none;border:none;
    font-family:'Inter';font-size:13.5px;font-weight:600;color:var(--ink-faint);
    border-bottom:2px solid transparent;cursor:pointer;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--brass);}

  main{flex:1;padding:20px 20px 48px;}
  section[hidden]{display:none;}

  h2.section-title{
    font-family:'Space Grotesk';font-weight:600;font-size:15px;
    margin:26px 0 12px;color:var(--ink);
    display:flex;align-items:center;gap:8px;
  }
  h2.section-title:first-child{margin-top:0;}
  h2.section-title .n{
    font-family:'JetBrains Mono';font-size:11px;color:var(--paper);
    background:var(--ink);width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  label{
    display:block;font-size:12px;font-weight:600;color:var(--ink-soft);
    margin-bottom:5px;margin-top:14px;
  }
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=date], input[type=tel], select, textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line-strong);
    background:var(--paper);border-radius:var(--radius);font-family:'Inter';
    font-size:14.5px;color:var(--ink);outline:none;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--brass);}
  textarea{resize:vertical;min-height:64px;}

  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}

  .service-row{display:flex;gap:8px;margin-top:8px;align-items:center;}
  .service-row input:first-child{flex:1;}
  .service-row input.harga{width:112px;text-align:right;}
  .service-row button.rm{
    background:none;border:none;color:var(--ink-faint);font-size:18px;
    width:28px;height:28px;cursor:pointer;flex-shrink:0;
  }
  .add-link{
    margin-top:10px;background:none;border:none;color:var(--brass-deep);
    font-weight:600;font-size:13px;cursor:pointer;padding:0;
  }

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .chip-input{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;}
  .chip{
    padding:7px 13px;border:1px solid var(--line-strong);border-radius:20px;
    font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;
    background:var(--paper);display:inline-block;user-select:none;
  }
  .chip-input:checked + .chip{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .chip-input:focus-visible + .chip{outline:2px solid var(--brass);outline-offset:1px;}

  .photo-grid{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .photo-thumb{
    width:76px;height:76px;position:relative;border-radius:var(--radius);
    overflow:hidden;border:1px solid var(--line-strong);
  }
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .x{
    position:absolute;top:2px;right:2px;background:rgba(24,21,17,0.75);
    color:#fff;width:18px;height:18px;border-radius:50%;border:none;
    font-size:12px;line-height:1;cursor:pointer;
  }
  .photo-add{
    width:76px;height:76px;border:1.5px dashed var(--line-strong);
    border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
    color:var(--ink-faint);font-size:22px;cursor:pointer;background:var(--paper);
  }
  input[type=file]{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;}

  .btn{
    width:100%;padding:14px;border:none;border-radius:var(--radius);
    font-family:'Space Grotesk';font-weight:600;font-size:14.5px;letter-spacing:.01em;
    cursor:pointer;margin-top:10px;
  }
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-primary:active{background:#000;}
  .btn-brass{background:var(--brass);color:#fff;}
  .btn-brass:active{background:var(--brass-deep);}
  .btn-ghost{background:none;border:1px solid var(--line-strong);color:var(--ink-soft);}
  .btn:disabled{opacity:.45;}
  .err{color:var(--danger);font-size:12.5px;margin-top:8px;display:none;}

  /* ---------- TICKET / INVOICE PREVIEW (v2 layout) ---------- */
  .ticket-wrap{position:relative;margin-top:4px;}
  .ticket{
    background:var(--paper);border:1px solid var(--line-strong);

  .ticket::before{
    content:'';position:absolute;inset:0;
    background:rgba(247,247,246,0.92);z-index:0;
  }
  .ticket > *{position:relative;z-index:1;}

  .t2-head{display:flex;align-items:flex-start;justify-content:space-between;
    padding-bottom:14px;border-bottom:1px dashed var(--line-strong);gap:10px;}
  .t2-logo{display:flex;flex-direction:column;gap:3px;}
  .t2-logo img{height:26px;width:auto;filter:grayscale(1);display:block;}
  .t2-logo .tag{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.14em;
    color:var(--ink-faint);text-transform:uppercase;}
  .t2-meta{text-align:right;flex-shrink:0;}
  .t2-meta .inv{font-family:'JetBrains Mono';font-size:11px;font-weight:600;color:var(--ink);}
  .t2-meta .date{font-size:11px;color:var(--ink-faint);margin-top:3px;}

  .t2-parties{display:flex;align-items:stretch;padding:13px 0;
    border-bottom:1px dashed var(--line-strong);gap:12px;}
  .t2-party{flex:1;display:flex;align-items:flex-start;gap:8px;min-width:0;}
  .t2-party svg.ic{margin-top:2px;color:var(--ink-faint);}
  .t2-party .txt{min-width:0;}
  .t2-party .lbl{font-size:10.5px;color:var(--ink-faint);}
  .t2-party .val{font-size:13px;font-weight:700;color:var(--ink);margin-top:1px;
    overflow-wrap:break-word;}
  .t2-divider{width:1px;align-self:stretch;background:var(--line-strong);flex-shrink:0;}

  .t2-grid{display:flex;gap:14px;padding:15px 0;
    border-bottom:1px dashed var(--line-strong);}
  .t2-col{flex:1 1 0;min-width:0;}
  .t2-col h3{font-family:'Space Grotesk';font-size:11.5px;font-weight:700;
    letter-spacing:.03em;margin:0 0 8px;color:var(--ink);}
  .t2-svc-row{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;
    padding:2.5px 0;color:var(--ink-soft);}
  .t2-svc-row .pr{font-family:'JetBrains Mono';color:var(--ink);flex-shrink:0;}
  .t2-svc-total{display:flex;justify-content:space-between;margin-top:7px;padding-top:7px;
    border-top:1px solid var(--line-strong);font-weight:700;font-size:12.5px;}
  .t2-svc-total .pr{font-family:'JetBrains Mono';color:var(--brass-deep);}
  .t2-payment{text-align:right;font-size:10.5px;font-weight:600;color:var(--ink-soft);margin-top:4px;letter-spacing:.03em;}

  .t2-detail-card{background:var(--stone-deep);border-radius:6px;padding:10px 11px;}
  .t2-detail-row{display:flex;align-items:flex-start;gap:7px;font-size:11.3px;
    color:var(--ink-soft);padding:3px 0;line-height:1.4;}
  .t2-detail-row svg.ic{margin-top:1.5px;color:var(--ink-soft);}
  .t2-detail-row b{color:var(--ink);font-weight:700;}
  .t2-kondisi{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .t2-kondisi .tag{font-size:9.5px;font-weight:700;background:var(--paper);
    color:var(--ink-soft);padding:3.5px 8px;border-radius:20px;
    border:1px solid var(--line-strong);}

  .t2-bottom{padding:15px 0;}
  .t2-reco-card{background:var(--paper);border:1px solid var(--line-strong);
    border-radius:10px;padding:14px;display:flex;gap:14px;align-items:flex-start;}
  .t2-reco-card.single{display:block;}
  .t2-note-card{flex:1 1 0;min-width:0;
    display:flex;gap:8px;align-items:flex-start;}
  .t2-note-card svg.ic{margin-top:2px;color:var(--ink-soft);width:16px;height:16px;flex-shrink:0;}
  .t2-note-card .body h4{font-family:'Space Grotesk';font-size:10.5px;font-weight:700;
    letter-spacing:.03em;margin:0 0 4px;color:var(--ink);text-transform:uppercase;}
  .t2-note-card .body p{font-size:11px;color:var(--ink-soft);margin:0;line-height:1.45;}
  .t2-photos{display:flex;gap:7px;flex:0 0 auto;}
  .t2-photos img{width:60px;height:60px;object-fit:cover;
    border-radius:6px;border:1px solid var(--line-strong);display:block;flex-shrink:0;}

  .t2-foot{padding-top:14px;border-top:1px dashed var(--line-strong);text-align:center;}
  .t2-foot .thanks{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;
    justify-content:center;gap:5px;flex-wrap:wrap;}
  .t2-foot .thanks b{color:var(--ink);font-weight:700;}
  .t2-foot .thanks svg.ic{color:var(--brass-deep);width:13px;height:13px;}
  .t2-foot .sub{font-size:10.5px;color:var(--ink-faint);margin-top:3px;}
  .t2-contact{display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:10px;font-size:10px;color:var(--ink-faint);flex-wrap:wrap;
    text-align:center;font-family:'JetBrains Mono';}
  .t2-contact span{display:flex;align-items:flex-start;justify-content:center;gap:4px;text-align:center;}
  .t2-contact span svg.ic{margin-top:1px;flex-shrink:0;}
  .t2-contact .txt{display:inline-block;text-align:center;}
  .t2-contact svg.ic{width:11px;height:11px;color:var(--ink-faint);}
  .t2-contact .divider-dot{color:var(--line-strong);}

  .actions{margin-top:18px;}
  .helper{font-size:11.5px;color:var(--ink-faint);text-align:center;margin-top:10px;line-height:1.5;}

  /* ---------- HISTORY ---------- */
  .search{margin-bottom:14px;}
  .hist-item{
    background:var(--paper);border:1px solid var(--line-strong);
    padding:13px 14px;margin-bottom:8px;cursor:pointer;
    display:flex;align-items:center;gap:10px;
  }
  .hist-item:active{background:var(--stone-deep);}
  .hist-item .who{flex:1;min-width:0;}
  .hist-item .name{font-weight:700;font-size:13.5px;}
  .hist-item .sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-item .amt{font-family:'JetBrains Mono';font-size:12.5px;font-weight:600;
    color:var(--brass-deep);flex-shrink:0;}
  .empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:40px 10px;line-height:1.6;}
  .loading{text-align:center;color:var(--ink-faint);font-size:13px;padding:24px 0;}
</style>

        <input type="radio" name="kondisi" class="chip-input" id="kc-normal" value="Normal"><label class="chip" for="kc-normal">Normal</label>
        <input type="radio" name="kondisi" class="chip-input" id="kc-rontok" value="Rontok"><label class="chip" for="kc-rontok">Rontok</label>
        <input type="radio" name="kondisi" class="chip-input" id="kc-berketombe" value="Berketombe"><label class="chip" for="kc-berketombe">Berketombe</label>
        <input type="radio" name="kondisi" class="chip-input" id="kc-kering" value="Kering"><label class="chip" for="kc-kering">Kering</label>
        <input type="radio" name="kondisi" class="chip-input" id="kc-kombinasi" value="Kombinasi"><label class="chip" for="kc-kombinasi">Kombinasi</label>
      </div>
      <label for="f-catatan">Saran perawatan</label>
      <textarea id="f-catatan" placeholder="cth. Pakai hair mask 1-2x/minggu"></textarea>

      <h2 class="section-title"><span class="n">4</span>Foto Hasil Potong</h2>
      <div class="photo-grid" id="photo-grid">
        <label class="photo-add" for="f-photo">+</label>
      </div>
      <input type="file" id="f-photo" accept="image/*" multiple>

      <div class="err" id="form-err"></div>
      <button class="btn btn-primary" id="submit-btn" style="margin-top:24px;">Simpan &amp; Buat Invoice</button>
    </section>

    <!-- ===== PREVIEW VIEW ===== -->
    <section id="view-preview" hidden>
      <div class="ticket-wrap">
        <div class="ticket" id="ticket-node"></div>
      </div>
      <div class="actions">
        <button class="btn btn-brass" id="share-wa-btn">Bagikan ke WhatsApp</button>
        <button class="btn btn-ghost" id="download-btn">Unduh sebagai gambar</button>
        <button class="btn btn-ghost" id="new-invoice-btn">+ Buat invoice baru</button>
      </div>
      <p class="helper" id="preview-helper"></p>
    </section>

    <!-- ===== HISTORY VIEW ===== -->
    <section id="view-history" hidden>
      <input type="text" class="search" id="hist-search" placeholder="Cari nama customer…">
      <div id="hist-list"><div class="loading">Memuat riwayat…</div></div>
    </section>

  </main>

<script>
(function(){
  "use strict";

  // ---------- icons ----------
  const ICONS = {
    user: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"></circle><path d="M4.5 20c1.4-4 4-6 7.5-6s6.1 2 7.5 6"></path></svg>',
    scissors: '<svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"></circle><circle cx="6" cy="18" r="2.4"></circle><path d="M20 5 8 15M8 9l12 10M9.6 12 8 13.4"></path></svg>',
    wave: '<svg class="ic" viewBox="0 0 24 24"><path d="M3 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0M3 17c2-3 4-3 6 0s4 3 6 0 4-3 6 0"></path></svg>',
    comb: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16M6 5v14M9 5v9M12 5v14M15 5v9M18 5v14"></path></svg>',
    strand: '<svg class="ic" viewBox="0 0 24 24"><path d="M8 3c-3 3-3 6 0 9s3 6 0 9M14 3c3 3 3 6 0 9s-3 6 0 9"></path></svg>',
    ruler: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1"></rect><path d="M7 8v3M11 8v3M15 8v3"></path></svg>',
    droplet: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 3c4 5 6.5 8.3 6.5 11.3A6.5 6.5 0 1 1 5.5 14.3C5.5 11.3 8 8 12 3Z"></path></svg>',
    heart: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.2 2.4 5 6 5c2.1 0 3.6 1.1 4.6 2.6.4.6 1.4.6 1.8 0C13.4 6.1 14.9 5 17 5c3.6 0 5.5 3.2 4 6.7C19.5 16.4 12 21 12 21Z"></path></svg>',
    phone: '<svg class="ic" viewBox="0 0 24 24"><path d="M6 3h3l2 5-2.5 1.8a11 11 0 0 0 5.7 5.7L16 13l5 2v3c0 1.1-.9 2-2 2C10.8 20 4 13.2 4 5c0-1.1.9-2 2-2Z"></path></svg>',
    pin: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 21s7-6.6 7-11.5a7 7 0 1 0-14 0C5 14.4 12 21 12 21Z"></path><circle cx="12" cy="9.5" r="2.3"></circle></svg>'
  };

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const fmtRp = (n) => "Rp " + (Math.round(n)||0).toLocaleString('id-ID');
  const todayISO = () => new Date().toISOString().slice(0,10);
  const fmtDateID = (iso) => {
    if(!iso) return "-";
    const d = new Date(iso+"T00:00:00");
    return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
  };
  function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let photos = [];      // array of dataURLs (current draft)
  let currentTicket = null; // record currently shown in preview
  let historyCache = [];

  // ---------- view switching ----------
  function showView(name){
    ['form','preview','history'].forEach(v=>{
      $('view-'+v).hidden = (v!==name);
    });
    document.querySelectorAll('.tab').forEach(t=>{
      t.classList.toggle('active', t.dataset.view===name || (name==='preview' && t.dataset.view==='form'));
    });
    if(name==='history') loadHistory();
  }
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>showView(t.dataset.view));
  });

  // ---------- service rows ----------
  function attachServiceRowEvents(row){
    row.querySelector('.rm').addEventListener('click', ()=>{
      if(document.querySelectorAll('#service-list .service-row').length>1) row.remove();
    });
    row.querySelector('.svc-harga').addEventListener('input', (e)=>{
      e.target.value = e.target.value.replace(/[^0-9]/g,'');
    });
  }
  function addServiceRow(nama, harga){
    const row = document.createElement('div');
    row.className = 'service-row';
    row.innerHTML =
      '<input type="text" class="svc-nama" placeholder="Nama service / produk" value="'+(nama?escapeAttr(nama):'')+'">' +
      '<input type="text" inputmode="numeric" class="harga svc-harga" placeholder="Harga" value="'+(harga?harga:'')+'">' +
      '<button class="rm" title="Hapus">×</button>';
    attachServiceRowEvents(row);
    $('service-list').appendChild(row);
  }
  document.querySelectorAll('#service-list .service-row').forEach(attachServiceRowEvents);
  $('add-service').addEventListener('click', ()=>addServiceRow());

  function getServices(){
    return Array.from(document.querySelectorAll('#service-list .service-row')).map(r=>({
      nama: r.querySelector('.svc-nama').value.trim(),
      harga: parseInt(r.querySelector('.svc-harga').value||'0',10)
    })).filter(s=>s.nama);
  }

  // ---------- kondisi chips (native radios, single choice, no JS needed to toggle) ----------
  function getKondisi(){
    const checked = document.querySelector('#chips-kondisi .chip-input:checked');
    return checked ? checked.value : '';
  }
  function resetKondisi(){
    document.querySelectorAll('#chips-kondisi .chip-input').forEach(c=>c.checked=false);
  }

  // ---------- payment method chips ----------
  function getPayment(){
    const checked = document.querySelector('#chips-payment .chip-input:checked');
    return checked ? checked.value : '';
  }
  function resetPayment(){
    document.querySelectorAll('#chips-payment .chip-input').forEach(c=>c.checked=false);
  }

  // ---------- photos ----------
  function resizeImage(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 640;
          const scale = Math.min(1, maxW/img.width);
          const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          const canvas = document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', 0.62));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function renderPhotoGrid(){
    const grid = $('photo-grid');
    grid.innerHTML = '';
    photos.forEach((src, i)=>{
      const t = document.createElement('div');
      t.className='photo-thumb';
      t.innerHTML = '<img src="'+src+'"><button class="x" data-i="'+i+'">×</button>';
      grid.appendChild(t);
    });
    if(photos.length<3){
      const add = document.createElement('label');
      add.className='photo-add'; add.setAttribute('for','f-photo'); add.textContent='+';
      grid.appendChild(add);
    }
    grid.querySelectorAll('.x').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.preventDefault();
        photos.splice(parseInt(btn.dataset.i,10),1);
        renderPhotoGrid();
      });
    });
  }
  $('f-photo').addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files).slice(0, 3-photos.length);
    for(const f of files){
      try{ photos.push(await resizeImage(f)); }catch(err){}
    }
    e.target.value = '';
    renderPhotoGrid();
  });

  // ---------- storage ----------
  async function getIndex(){
    try{
      const r = await window.storage.get('invoices:index', true);
      return r && r.value ? JSON.parse(r.value) : [];
    }catch(e){ return []; }
  }
  async function saveRecord(rec){
    await window.storage.set('invoices:'+rec.id, JSON.stringify(rec), true);
    const idx = await getIndex();
    idx.unshift(rec.id);
    await window.storage.set('invoices:index', JSON.stringify(idx.slice(0,300)), true);
  }
  async function getRecord(id){
    try{
      const r = await window.storage.get('invoices:'+id, true);
      return r && r.value ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }

  // ---------- submit form ----------
  $('submit-btn').addEventListener('click', async ()=>{
    const nama = $('f-nama').value.trim();
    const services = getServices();
    const errEl = $('form-err');
    if(!nama || services.length===0){
      errEl.textContent = 'Isi nama customer dan minimal 1 service/produk ya.';
      errEl.style.display='block';
      return;
    }
    errEl.style.display='none';
    $('submit-btn').disabled = true;
    $('submit-btn').textContent = 'Menyimpan…';

    const rec = {
      id: Date.now().toString(36),
      nama,
      wa: $('f-wa').value.trim(),
      tanggal: $('f-tanggal').value || todayISO(),
      kapster: $('f-kapster').value.trim(),
      services,
      total: services.reduce((s,x)=>s+x.harga,0),
      atas: $('f-atas').value.trim(),
      samping: $('f-samping').value.trim(),
      level: $('f-level').value,
      tipe: $('f-tipe').value,
      kondisi: getKondisi(),
      pembayaran: getPayment(),
      catatan: $('f-catatan').value.trim(),
      photos: photos.slice(),
      createdAt: Date.now()
    };
    try{
      await saveRecord(rec);
    }catch(e){ /* still show preview even if save fails */ }

    $('submit-btn').disabled = false;
    $('submit-btn').textContent = 'Simpan & Buat Invoice';
    openPreview(rec);
    resetForm();
  });

  function resetForm(){
    $('f-nama').value=''; $('f-wa').value=''; $('f-tanggal').value='';
    $('f-kapster').value=''; $('f-atas').value=''; $('f-samping').value='';
    $('f-level').value=''; $('f-tipe').value=''; $('f-catatan').value='';
    $('service-list').innerHTML='';
    addServiceRow();
    resetKondisi();
    resetPayment();
    photos = []; renderPhotoGrid();
  }
  $('f-tanggal').value = todayISO();

  function openPreview(rec){
    currentTicket = rec;
    $('ticket-node').innerHTML = ticketHTML(rec);
    $('preview-helper').textContent = rec.wa
      ? 'Nomor WhatsApp customer terisi — invoice akan langsung terbuka di chat mereka.'
      : 'Belum ada nomor WhatsApp customer, jadi kamu pilih sendiri kontaknya saat membagikan.';
    showView('preview');
  }

  // ---------- share / download ----------
  function buildCaption(rec){
    let lines = [
      'INVOICE — KUTMEISTER',
      'Customer: '+rec.nama,
      'Tanggal: '+fmtDateID(rec.tanggal),
    ];
    if(rec.kapster) lines.push('Hair Stylist: '+rec.kapster);
    lines.push('');
    rec.services.forEach(s=> lines.push('• '+s.nama+' — '+fmtRp(s.harga)));
    lines.push('Total: '+fmtRp(rec.total));
    if(rec.atas||rec.samping) lines.push('', 'Model: '+[rec.atas,rec.samping].filter(Boolean).join(' / '));
    lines.push('', 'Thank you for trusting KUTMEISTER 🙏',
      '085351332209', 'Jl. Rakata No. 19, Merdeka, Kec. Sumur Bandung, Kota Bandung');
    return lines.join('\n');
  }

  async function ticketToBlob(){
    const node = $('ticket-node').parentElement; // .ticket-wrap
    const canvas = await html2canvas(node, {backgroundColor:'#faf8f3', scale:2});
    return new Promise(res=>canvas.toBlob(res, 'image/png', 0.95));
  }

  $('download-btn').addEventListener('click', async ()=>{
    $('download-btn').textContent = 'Menyiapkan…';
    try{
      const blob = await ticketToBlob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'invoice-'+currentTicket.nama.replace(/\s+/g,'_')+'.png';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }catch(e){ alert('Gagal membuat gambar. Coba lagi ya.'); }
    $('download-btn').textContent = 'Unduh sebagai gambar';
  });

  $('share-wa-btn').addEventListener('click', async ()=>{
    const btn = $('share-wa-btn');
    btn.disabled = true; btn.textContent = 'Menyiapkan…';
    const caption = buildCaption(currentTicket);
    try{
      const blob = await ticketToBlob();
      const file = new File([blob], 'invoice.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text: caption, title:'Invoice KUTMEISTER'});
        btn.disabled = false; btn.textContent = 'Bagikan ke WhatsApp';
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'invoice-'+currentTicket.nama.replace(/\s+/g,'_')+'.png';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      const numRaw = (currentTicket.wa||'').replace(/[^0-9]/g,'');
      const num = numRaw.startsWith('0') ? '62'+numRaw.slice(1) : numRaw;
      const waUrl = num ? ('https://wa.me/'+num+'?text='+encodeURIComponent(caption))
                         : ('https://wa.me/?text='+encodeURIComponent(caption));
      window.open(waUrl, '_blank');
    }catch(e){
      const numRaw = (currentTicket.wa||'').replace(/[^0-9]/g,'');
      const num = numRaw.startsWith('0') ? '62'+numRaw.slice(1) : numRaw;
      const waUrl = num ? ('https://wa.me/'+num+'?text='+encodeURIComponent(caption))
                         : ('https://wa.me/?text='+encodeURIComponent(caption));
      window.open(waUrl, '_blank');
    }
    btn.disabled = false; btn.textContent = 'Bagikan ke WhatsApp';
  });

  $('new-invoice-btn').addEventListener('click', ()=>showView('form'));

  // ---------- history ----------
  async function loadHistory(){
    const listEl = $('hist-list');
    listEl.innerHTML = '<div class="loading">Memuat riwayat…</div>';
    const idx = await getIndex();
    if(idx.length===0){
      listEl.innerHTML = '<div class="empty">Belum ada invoice.<br>Invoice yang kamu simpan akan muncul di sini.</div>';
      historyCache = [];
      return;
    }
    const recs = (await Promise.all(idx.slice(0,100).map(getRecord))).filter(Boolean);
    historyCache = recs;
    renderHistory(recs);
  }
  function renderHistory(recs){
    const listEl = $('hist-list');
    if(recs.length===0){
      listEl.innerHTML = '<div class="empty">Tidak ada hasil untuk pencarian ini.</div>';
      return;
    }
    listEl.innerHTML = '';
    recs.forEach(rec=>{
      const item = document.createElement('div');
      item.className='hist-item';
      item.innerHTML =
        '<div class="who"><div class="name">'+escapeHtml(rec.nama)+'</div>' +
        '<div class="sub">'+fmtDateID(rec.tanggal)+' · '+escapeHtml(rec.kapster||'-')+'</div></div>' +
        '<div class="amt">'+fmtRp(rec.total)+'</div>';
      item.addEventListener('click', ()=>openPreview(rec));
      listEl.appendChild(item);
    });
  }
  $('hist-search').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    if(!q){ renderHistory(historyCache); return; }
    renderHistory(historyCache.filter(r=>r.nama.toLowerCase().includes(q)));
  });

  renderPhotoGrid();

})();
</script>
</body>
</html>
